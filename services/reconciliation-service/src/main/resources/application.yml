spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transaction_app}
    password: ${DB_PASSWORD:transaction_app_dev}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

reconciliation:
  poll-delay-ms: ${RECONCILIATION_POLL_DELAY_MS:2000}
  pending-retry-seconds: ${RECONCILIATION_PENDING_RETRY_SECONDS:5}
  batch-size: ${RECONCILIATION_BATCH_SIZE:100}
  replay-topic: ${RECONCILIATION_REPLAY_TOPIC:transactions.created.v1}
  security:
    enabled: ${RECONCILIATION_SECURITY_ENABLED:false}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          jwk-set-uri: ${JWT_JWK_SET_URI:}

info:
  app:
    name: reconciliation-service
    version: ${project.version:dev}
