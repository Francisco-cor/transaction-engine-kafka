spring:
  application:
    name: reconciliation-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transaction_app}
    password: ${DB_PASSWORD:transaction_app_dev}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

reconciliation:
  poll-delay-ms: ${RECONCILIATION_POLL_DELAY_MS:2000}
  pending-retry-seconds: ${RECONCILIATION_PENDING_RETRY_SECONDS:5}
  batch-size: ${RECONCILIATION_BATCH_SIZE:100}
  replay-topic: ${RECONCILIATION_REPLAY_TOPIC:transactions.created.v1}

info:
  app:
    name: reconciliation-service
    version: ${project.version:dev}
