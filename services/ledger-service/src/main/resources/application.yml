spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: ledger-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          jwk-set-uri: ${JWT_JWK_SET_URI:}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transaction_app}
    password: ${DB_PASSWORD:transaction_app_dev}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 2000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${LEDGER_CONSUMER_GROUP:ledger-service}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # F5 Avro wire opt-in: set KAFKA_VALUE_DESERIALIZER to KafkaAvroDeserializer or ErrorHandlingDeserializer
      value-deserializer: ${KAFKA_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      properties:
        isolation.level: read_committed
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${KAFKA_SPECIFIC_AVRO_READER:true}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: ${KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      transaction-id-prefix: ${KAFKA_TRANSACTION_ID_PREFIX:}
      properties:
        enable.idempotence: true
        acks: all
        compression.type: zstd
        # F4 transactional outbox: when KAFKA_TRANSACTION_ID_PREFIX set, producer is transactional
        # and OutboxPublisher uses KafkaTransactionManager for exactly-once (producer + DB markPublished in one Tx)
        transactional.id: ${KAFKA_TRANSACTION_ID_PREFIX:}
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: false
        use.latest.version: true

server:
  shutdown: graceful
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka,outbox
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

resilience4j:
  circuitbreaker:
    instances:
      db:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      ledger-outbox:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  bulkhead:
    instances:
      # F4 per-topic isolation: ledger 10, fraud 10, outbox 5 — prevents hot-account from starving others
      db:
        maxConcurrentCalls: 10
        maxWaitDuration: 100ms
      ledger:
        maxConcurrentCalls: 10
        maxWaitDuration: 50ms
      ledger-outbox:
        maxConcurrentCalls: 5
        maxWaitDuration: 50ms
  timelimiter:
    instances:
      db:
        timeoutDuration: 3s
      ledger:
        timeoutDuration: 3s
  retry:
    instances:
      db:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
  # Queue shed: when bulkhead full, fail fast 503 with Retry-After
  bulkhead-queue:
    ledger:
      maxQueueSize: 50

ledger:
  security:
    enabled: ${LEDGER_SECURITY_ENABLED:false}
  input-topic: ${LEDGER_INPUT_TOPIC:transactions.created.v1}
  outcome-topic: ${LEDGER_OUTCOME_TOPIC:transactions.committed.v1}
  lock:
    timeout-ms: ${LEDGER_LOCK_TIMEOUT_MS:3000}
  optimistic:
    enabled: ${LEDGER_OPTIMISTIC_ENABLED:false}
    max-retries: ${LEDGER_OPTIMISTIC_MAX_RETRIES:3}
    backoff-ms: ${LEDGER_OPTIMISTIC_BACKOFF_MS:10}
  sharding:
    shard-count: ${LEDGER_SHARD_COUNT:32}
  consumer:
    retry-interval-ms: ${LEDGER_RETRY_INTERVAL_MS:1000}
    max-attempts: ${LEDGER_MAX_ATTEMPTS:3}
    backoff-multiplier: ${LEDGER_BACKOFF_MULTIPLIER:2.0}
    backoff-max-interval-ms: ${LEDGER_BACKOFF_MAX_INTERVAL_MS:10000}
    jitter-factor: ${LEDGER_JITTER_FACTOR:0.2}
  outbox:
    publisher-enabled: ${LEDGER_OUTBOX_PUBLISHER_ENABLED:true}
    poll-delay-ms: ${LEDGER_OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${LEDGER_OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${LEDGER_OUTBOX_LEASE_SECONDS:30}
    base-backoff-seconds: ${LEDGER_OUTBOX_BASE_BACKOFF_SECONDS:1}
    max-backoff-seconds: ${LEDGER_OUTBOX_MAX_BACKOFF_SECONDS:60}
    backlog-threshold: ${LEDGER_OUTBOX_BACKLOG_THRESHOLD:100}

info:
  app:
    name: ledger-service
    version: ${project.version:dev}