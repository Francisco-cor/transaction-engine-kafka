spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transaction_app}
    password: ${DB_PASSWORD:transaction_app_dev}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 2000
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${NOTIFICATION_CONSUMER_GROUP:notification-service}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        acks: all

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
  metrics:
    tags:
      application: ${spring.application.name}

resilience4j:
  retry:
    instances:
      notification:
        maxAttempts: 5
        waitDuration: 500ms
        enableExponentialBackoff: true

notification:
  input-topic: ${NOTIFICATION_INPUT_TOPIC:transactions.committed.v1}
  consumer:
    retry-interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:1000}
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  webhook:
    url: ${NOTIFICATION_WEBHOOK_URL:}
  fake-provider:
    failure-rate: ${NOTIFICATION_FAKE_FAILURE_RATE:0.05}
    latency-ms: ${NOTIFICATION_FAKE_LATENCY_MS:50}

info:
  app:
    name: notification-service
    version: ${project.version:dev}
