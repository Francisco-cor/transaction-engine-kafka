spring:
  application:
    name: transaction-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 64KB
      max-request-size: 64KB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DB_USER:transaction_app}
    password: ${DB_PASSWORD:transaction_app_dev}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 2000
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: filesystem:${FLYWAY_MIGRATIONS_PATH:infra/postgres/migrations}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev}
      timeout: 1000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:}
          jwk-set-uri: ${JWT_JWK_SET_URI:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # F5 Avro wire: switch via KAFKA_VALUE_SERIALIZER (default JSON). For Avro: io.confluent.kafka.serializers.KafkaAvroSerializer
      # Runtime actual JSON StringSerializer con header schema_version (ADR-008). Para Avro real: set KAFKA_VALUE_SERIALIZER Avro + specific.avro.reader=true
      value-serializer: ${KAFKA_VALUE_SERIALIZER:org.apache.kafka.common.serialization.StringSerializer}
      transaction-id-prefix: ${KAFKA_TRANSACTION_ID_PREFIX:}
      properties:
        enable.idempotence: true
        acks: all
        compression.type: zstd
        transactional.id: ${KAFKA_TRANSACTION_ID_PREFIX:}
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        auto.register.schemas: false
        use.latest.version: true
    consumer:
      # F5 consumer: Avro wire opt-in via KAFKA_VALUE_DESERIALIZER; fallback JSON via ErrorHandlingDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: ${KAFKA_VALUE_DESERIALIZER:org.apache.kafka.common.serialization.StringDeserializer}
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://schema-registry:8081}
        specific.avro.reader: ${KAFKA_SPECIFIC_AVRO_READER:true}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 64KB
    max-swallow-size: 64KB
    threads:
      max: 50
  max-http-request-header-size: 8KB
  error:
    include-stacktrace: never
    include-message: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,kafka,outbox
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}
  observations:
    key-values:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      db:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  bulkhead:
    instances:
      db:
        maxConcurrentCalls: 20
  timelimiter:
    instances:
      db:
        timeoutDuration: 3s

transaction:
  security:
    enabled: ${TRANSACTION_SECURITY_ENABLED:false}
    replay-protection:
      enabled: ${TRANSACTION_REPLAY_PROTECTION_ENABLED:true}
      max-body-bytes: 65536
  rate-limit:
    rps: ${TRANSACTION_RATE_LIMIT_RPS:50}
    burst: ${TRANSACTION_RATE_LIMIT_BURST:100}
  idempotency:
    ttl-days: ${TRANSACTION_IDEMPOTENCY_TTL_DAYS:7}
  events:
    topic: ${TRANSACTION_CREATED_TOPIC:transactions.created.v1}

outbox:
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    base-backoff-seconds: ${OUTBOX_BASE_BACKOFF_SECONDS:1}
    max-backoff-seconds: ${OUTBOX_MAX_BACKOFF_SECONDS:60}

statement:
  cache:
    local-ttl-ms: ${STATEMENT_CACHE_LOCAL_TTL_MS:1000}
    redis-ttl-ms: ${STATEMENT_CACHE_REDIS_TTL_MS:1000}

info:
  app:
    name: transaction-service
    version: ${project.version:dev}