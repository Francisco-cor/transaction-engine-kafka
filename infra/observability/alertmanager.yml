global: { resolve_timeout: 5m }
route:
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  receiver: slack
  routes:
    - { match: { severity: critical }, receiver: slack-critical }
receivers:
  - name: slack
    slack_configs:
      - { api_url: "${SLACK_WEBHOOK_URL:-}", channel: "#alerts", title: "{{ .GroupLabels.alertname }}", text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}" }
  - name: slack-critical
    slack_configs:
      - { api_url: "${SLACK_WEBHOOK_URL:-}", channel: "#alerts-critical", title: "CRITICAL {{ .GroupLabels.alertname }}" }
inhibit_rules:
  - { source_match: { severity: critical }, target_match: { severity: warning }, equal: [alertname] }
