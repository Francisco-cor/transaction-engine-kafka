global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["transaction-service:8080"]

  - job_name: ledger-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ledger-service:8082"]

  - job_name: fraud-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["fraud-service:8083"]

  - job_name: reconciliation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reconciliation-service:8084"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8086"]

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8085"]

  # Exporters opcionales — habilita con: docker compose -f infra/docker-compose/docker-compose.yml -f infra/docker-compose/docker-compose.exporters.yml up -d
  # Por defecto estos targets fallan scrape hasta que se levanten los exporters; no bloquea el resto de métricas.
  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
    scrape_interval: 30s

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter:9121"]
    scrape_interval: 30s

  - job_name: kafka
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-jmx-exporter:9308"]
    scrape_interval: 30s
