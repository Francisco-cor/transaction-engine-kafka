name: transaction-engine-kafka

services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-topics:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-604800000}
      DLT_RETENTION_MS: ${KAFKA_DLT_RETENTION_MS:-1209600000}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-6}
    volumes:
      - ./init/create-topics.sh:/opt/init-topics/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/init-topics/create-topics.sh"]
    restart: "no"

  postgres:
    image: postgres:16.4-alpine
    hostname: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres_dev}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-transaction_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-transaction_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-transaction_migrator_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/01-create-users.sh:/docker-entrypoint-initdb.d/01-create-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres-migrate:
    image: flyway/flyway:10.17.0-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      FLYWAY_USER: ${POSTGRES_MIGRATOR_USER:-transaction_migrator}
      FLYWAY_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-transaction_migrator_dev}
      FLYWAY_SCHEMAS: transaction_schema
      FLYWAY_DEFAULT_SCHEMA: transaction_schema
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_PLACEHOLDERS_APPUSER: ${POSTGRES_APP_USER:-transaction_app}
    volumes:
      - ../postgres/migrations:/flyway/sql:ro
    command: ["migrate"]
    restart: "no"

  transaction-service:
    build:
      context: ../..
      dockerfile: services/transaction-service/Dockerfile
    stop_grace_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      DB_USER: ${POSTGRES_APP_USER:-transaction_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OUTBOX_PUBLISHER_ENABLED: "true"
      TRANSACTION_SECURITY_ENABLED: ${TRANSACTION_SECURITY_ENABLED:-false}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.10"

  ledger-service:
    build:
      context: ../..
      dockerfile: services/ledger-service/Dockerfile
    stop_grace_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      DB_USER: ${POSTGRES_APP_USER:-transaction_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LEDGER_OUTBOX_PUBLISHER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.10"

  fraud-service:
    build:
      context: ../..
      dockerfile: services/fraud-service/Dockerfile
    stop_grace_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      DB_USER: ${POSTGRES_APP_USER:-transaction_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_dev}@redis:6379
      FRAUD_OUTBOX_PUBLISHER_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040

  reconciliation-service:
    build:
      context: ../..
      dockerfile: services/reconciliation-service/Dockerfile
    stop_grace_period: 45s
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      DB_USER: ${POSTGRES_APP_USER:-transaction_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    stop_grace_period: 45s
    depends_on:
      kafka:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      postgres-migrate:
        condition: service_completed_successfully
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      DB_USER: ${POSTGRES_APP_USER:-transaction_app}
      DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-transaction_app_dev}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      transaction-service:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      GATEWAY_TRANSACTION_SERVICE_URI: http://transaction-service:8080
      GATEWAY_RECONCILIATION_SERVICE_URI: http://reconciliation-service:8084
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
      GATEWAY_SECURITY_ENABLED: ${GATEWAY_SECURITY_ENABLED:-false}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_TRACES_EXPORTER: otlp

  redis:
    image: redis:7.4-alpine
    hostname: redis
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_dev}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-redis_dev} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  jaeger:
    image: jaegertracing/all-in-one:1.57
    hostname: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 12

  # OTEL Collector — tail sampling head (receives 4317/4318 from 6 services, exports to Jaeger/Tempo + exemplars)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    hostname: otel-collector
    command: ["--config=/etc/otelcol/collector-config.yml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ../observability/collector-config.yml:/etc/otelcol/collector-config.yml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:13133/ || exit 1"]
      interval: 10s
      retries: 6

  loki:
    image: grafana/loki:2.9.8
    hostname: loki
    ports: ["3100:3100"]
    volumes: ["../observability/loki-config.yml:/etc/loki/local-config.yaml:ro", "loki_data:/loki"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      retries: 6

  tempo:
    image: grafana/tempo:2.4.1
    hostname: tempo
    ports: ["3200:3200", "9095:9095"]
    volumes: ["../observability/tempo-config.yml:/etc/tempo.yaml:ro", "tempo_data:/tmp"]
    command: ["-config.file=/etc/tempo.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/status || exit 1"]
      interval: 10s
      retries: 6

  pyroscope:
    image: grafana/pyroscope:1.8.0
    hostname: pyroscope
    ports: ["4040:4040"]
    command: ["server"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4040/status || exit 1"]
      interval: 10s
      retries: 6

  alertmanager:
    image: prom/alertmanager:v0.27.0
    hostname: alertmanager
    ports: ["9093:9093"]
    volumes: ["../observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.53.1
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
      - ../observability/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.1.0
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_FEATURE_TOGGLES_ENABLE: "correlations,exemplars"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:
