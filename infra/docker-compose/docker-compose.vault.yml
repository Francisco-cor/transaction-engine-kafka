# Vault dev + External Secrets overlay — F3
# Uso: docker compose -f infra/docker-compose/docker-compose.yml -f infra/docker-compose/docker-compose.vault.yml up -d
# Provee Vault 1.15.6 dev con transit engine para tokenizar customerNote + KV para secretos
services:
  vault:
    image: hashicorp/vault:1.15.6
    hostname: vault
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add: [IPC_LOCK]
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      retries: 6

  vault-init:
    image: hashicorp/vault:1.15.6
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vault secrets enable -path=secret kv-v2 || true
        vault kv put secret/transaction-app DB_PASSWORD=transaction_app_dev || true
        vault kv put secret/redis REDIS_PASSWORD=redis_dev || true
        vault secrets enable transit || true
        vault write -f transit/keys/customer-note || true
        vault write transit/keys/customer-note exportable=false allow_plaintext_backup=false || true
        echo "vault init done: kv + transit/customer-note"

  external-secrets-operator:
    image: ghcr.io/external-secrets/external-secrets:v0.9.13
    hostname: external-secrets
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    command: ["--enable-leaderelection=false"]
    profiles: ["k8s"]
