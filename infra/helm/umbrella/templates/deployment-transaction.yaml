apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umbrella.fullname" . }}-transaction-service
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: transaction-service
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "umbrella.name" . }}
      app.kubernetes.io/component: transaction-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        linkerd.io/inject: {{ .Values.linkerd.inject | quote }}
      labels:
        app.kubernetes.io/name: {{ include "umbrella.name" . }}
        app.kubernetes.io/component: transaction-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "umbrella.fullname" . }}-transaction-service
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: transaction-service
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: transaction-service
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: transaction-service
          image: "{{ .Values.images.transactionService }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.transactionService.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.transactionService.port | quote }}
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: DB_USER
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            {{- if .Values.devSecrets }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "umbrella.fullname" . }}-dev-secrets
                  key: DB_PASSWORD
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
