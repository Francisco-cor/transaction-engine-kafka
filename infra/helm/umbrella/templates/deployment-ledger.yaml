apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umbrella.fullname" . }}-ledger-service
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "umbrella.name" . }}
      app.kubernetes.io/component: ledger-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "umbrella.name" . }}
        app.kubernetes.io/component: ledger-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: ledger-service
          image: "{{ .Values.images.ledgerService }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.ledgerService.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.ledgerService.port | quote }}
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: DB_URL
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: DB_USER
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: LEDGER_LOCK_TIMEOUT_MS
              value: "3000"
            {{- if .Values.devSecrets }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "umbrella.fullname" . }}-dev-secrets
                  key: DB_PASSWORD
            {{- end }}
