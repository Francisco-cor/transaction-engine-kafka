{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "umbrella.fullname" . }}-ledger-service
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: ledger-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "umbrella.fullname" . }}-ledger-service
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.autoscaling.maxReplicas }}
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ .Values.keda.kafka.bootstrapServers }}
        consumerGroup: {{ .Values.keda.kafka.consumerGroup }}
        topic: {{ .Values.keda.kafka.topic }}
        lagThreshold: {{ .Values.keda.kafka.lagThreshold | quote }}
        offsetResetPolicy: latest
        activationLagThreshold: "10"
      authenticationRef:
        name: {{ include "umbrella.fullname" . }}-keda-trigger-auth
        # Optional: create TriggerAuthentication for SASL if needed
---
# Optional TriggerAuthentication placeholder for Kafka (no auth in local kind)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "umbrella.fullname" . }}-keda-trigger-auth
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
spec:
  secretTargetRef: []
{{- end }}
