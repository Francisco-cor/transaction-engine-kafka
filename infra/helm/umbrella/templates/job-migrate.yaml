{{- /*
Flyway migration Job as Helm hook (pre-install/pre-upgrade) with ownership via dedicated ServiceAccount.
Uses same migrations as infra/postgres/migrations mounted via ConfigMap or init container.
For simplicity, image flyway migrates from jdbc url directly; migrations are baked via ConfigMap volume.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "umbrella.fullname" . }}-migrate
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "umbrella.name" . }}
        app.kubernetes.io/component: migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "umbrella.fullname" . }}-migrate
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: flyway
          image: {{ .Values.images.flyway }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command:
            - flyway
            - -url=jdbc:postgresql://{{ .Values.config.postgres.host }}:{{ .Values.config.postgres.port }}/{{ .Values.config.postgres.database }}
            - -user={{ .Values.config.postgres.migratorUser }}
            - -schemas={{ .Values.config.postgres.schema }}
            - -defaultSchema={{ .Values.config.postgres.schema }}
            - -locations=filesystem:/flyway/sql
            - -connectRetries=30
            - migrate
          env:
            - name: FLYWAY_PASSWORD
              {{- if .Values.devSecrets }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "umbrella.fullname" . }}-dev-secrets
                  key: MIGRATOR_PASSWORD
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "umbrella.fullname" . }}-external-secrets
                  key: migrator-password
                  optional: true
              {{- end }}
            - name: FLYWAY_PLACEHOLDERS_APPUSER
              value: {{ .Values.config.postgres.appUser | quote }}
          volumeMounts:
            - name: migrations
              mountPath: /flyway/sql
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ include "umbrella.fullname" . }}-migrations
            # Fallback: in prod, migrations are baked in image or initContainer git clone
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "umbrella.fullname" . }}-migrations
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  # Placeholder: real migrations are sourced from infra/postgres/migrations via helm --set-file or CI bake.
  # For kind demo, run: kubectl create configmap {{ include "umbrella.fullname" . }}-migrations --from-file=infra/postgres/migrations
  README: "Replace with actual migrations via helm template --set-file or external initContainer"
