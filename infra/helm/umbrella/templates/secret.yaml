{{- /*
Secrets are NOT stored plain in values.yaml for prod.
This template renders only in dev (values-dev.yaml) via .Values.devSecrets.
Prod must use ExternalSecrets (infra/k8s/external-secrets.yaml) or SealedSecrets.
*/ -}}
{{- if .Values.devSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "umbrella.fullname" . }}-dev-secrets
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.devSecrets.postgresAppPassword | quote }}
  MIGRATOR_PASSWORD: {{ .Values.devSecrets.postgresMigratorPassword | quote }}
  REDIS_PASSWORD: {{ .Values.devSecrets.redisPassword | quote }}
{{- end }}
