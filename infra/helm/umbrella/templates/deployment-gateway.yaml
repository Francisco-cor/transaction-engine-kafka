apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "umbrella.fullname" . }}-api-gateway
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "umbrella.name" . }}
      app.kubernetes.io/component: api-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "umbrella.name" . }}
        app.kubernetes.io/component: api-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: api-gateway
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: api-gateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      containers:
        - name: api-gateway
          image: "{{ .Values.images.apiGateway }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.apiGateway.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.service.apiGateway.port | quote }}
            - name: GATEWAY_TRANSACTION_SERVICE_URI
              value: "http://{{ include "umbrella.fullname" . }}-transaction-service:{{ .Values.service.transactionService.port }}"
            - name: GATEWAY_RECONCILIATION_SERVICE_URI
              value: "http://{{ include "umbrella.fullname" . }}-reconciliation-service:{{ .Values.service.reconciliationService.port }}"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: REDIS_HOST
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "umbrella.fullname" . }}-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
