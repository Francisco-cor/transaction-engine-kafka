# External Secrets Operator — ClusterSecretStore + ExternalSecret for prod
# Prereq: helm install external-secrets (https://external-secrets.io/latest/introduction/getting-started/)
# helm repo add external-secrets https://charts.external-secrets.io
# helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace --wait

---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transaction-engine-external-secrets
  namespace: transaction-engine
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: transaction-engine-external-secrets
    creationPolicy: Owner
    # template can map keys to expected env names
    template:
      type: Opaque
      data:
        db-password: "{{ .dbPassword }}"
        migrator-password: "{{ .migratorPassword }}"
        redis-password: "{{ .redisPassword }}"
        jwt-issuer-uri: "{{ .jwtIssuerUri }}"
  data:
    - secretKey: dbPassword
      remoteRef:
        key: prod/transaction-engine
        property: db_password
    - secretKey: migratorPassword
      remoteRef:
        key: prod/transaction-engine
        property: migrator_password
    - secretKey: redisPassword
      remoteRef:
        key: prod/transaction-engine
        property: redis_password
    - secretKey: jwtIssuerUri
      remoteRef:
        key: prod/transaction-engine
        property: jwt_issuer_uri
---
# ServiceAccount for ESO with IRSA (IAM Role for Service Account)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/external-secrets-role
automountServiceAccountToken: true
---
# SealedSecrets alternative (kubeseal) — encrypted manifest committed, decrypted by controller in cluster
# Install: helm install sealed-secrets -n kube-system --set-string fullnameOverride=sealed-secrets-controller sealed-secrets/sealed-secrets
# Create: echo -n transaction_app_dev | kubectl create secret generic transaction-engine-dev-secrets --dry-run=client --from-file=db-password=/dev/stdin -o yaml | kubeseal -f - -w infra/k8s/sealed-secrets.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: transaction-engine-sealed-secrets
  namespace: transaction-engine
spec:
  encryptedData:
    # Example placeholder — replace with actual kubeseal output, never commit plain value
    # kubeseal encrypts with cluster public key; this file is safe to commit
    db-password: AgB3...EXAMPLE_ENCRYPTED_VALUE...==
    redis-password: AgC7...EXAMPLE_ENCRYPTED_VALUE...==
  template:
    metadata:
      name: transaction-engine-sealed-secrets
      namespace: transaction-engine
    type: Opaque
