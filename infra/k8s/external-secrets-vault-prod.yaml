# Prod Vault ClusterSecretStore — approle + TLS (F9)
# Requires Vault prod cluster with approle auth mounted at auth/approle and transit engine
# Usage: kubectl apply -f infra/k8s/external-secrets-vault-prod.yaml -n transaction-engine
# External Secrets Operator must be installed: helm upgrade --install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
apiVersion: v1
kind: Secret
metadata:
  name: vault-approle
  namespace: transaction-engine
type: Opaque
stringData:
  # These are placeholders; real values come from Vault admin via sealed-secrets or CI injection
  roleId: "<approle-role-id-prod>"
  secretId: "<approle-secret-id-prod>"
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend-prod
spec:
  provider:
    vault:
      server: https://vault.prod.example.com:8200
      path: secret
      version: v2
      # CA bundle for TLS — base64 of prod CA
      caBundle: "<base64-ca-prod>"
      auth:
        appRole:
          path: approle
          roleId: vault-approle
          secretRef:
            name: vault-approle
            key: secretId
            namespace: transaction-engine
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: transaction-app-password-prod
  namespace: transaction-engine
spec:
  refreshInterval: 30m
  secretStoreRef: { name: vault-backend-prod, kind: ClusterSecretStore }
  target: { name: transaction-app-password, creationPolicy: Owner }
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: prod/transaction-engine, property: db_password }
    - secretKey: REDIS_PASSWORD
      remoteRef: { key: prod/transaction-engine, property: redis_password }
    - secretKey: JWT_ISSUER_URI
      remoteRef: { key: prod/transaction-engine, property: jwt_issuer_uri }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: customer-note-transit-prod
  namespace: transaction-engine
spec:
  refreshInterval: 30m
  secretStoreRef: { name: vault-backend-prod, kind: ClusterSecretStore }
  target: { name: customer-note-transit, creationPolicy: Owner }
  data:
    - secretKey: transit-key
      remoteRef: { key: prod/transit/keys/customer-note }
  # Rotation 90d handled by Vault rotation config, not ESO
