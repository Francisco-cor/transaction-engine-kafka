name: Deploy

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - 'infra/helm/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options: [dev, staging, demo]
        default: dev
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, demo]
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -reconfigure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        continue-on-error: true
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        continue-on-error: true
      - name: Infracost estimate (cost)
        uses: infracost/infracost-action@v0.10
        with:
          path: infra/terraform/envs/${{ matrix.env }}
          show-all-projects: true
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        continue-on-error: true
      - name: Comment PR with plan
        uses: marocchino/sticky-pull-request-comment@v2
        if: always()
        with:
          header: tf-plan-${{ matrix.env }}
          message: |
            #### Terraform Plan `${{ matrix.env }}`
            ```terraform
            ${{ steps.plan.outputs.stdout || 'plan skipped (no credentials in fork)' }}
            ```
            Cost estimated via infracost if API key present.

  terraform-apply:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/terraform/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -reconfigure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false tfplan
      - name: Terraform destroy (protected)
        if: inputs.action == 'destroy'
        run: |
          echo "Destroy ${{ inputs.environment }} — check prevent_destroy for prod"
          terraform destroy -auto-approve
        # prod has lifecycle prevent_destroy true hint; manual confirmation required via environment protection

  helm-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    needs: terraform-apply
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --name transaction-engine-${{ inputs.environment }} --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Helm lint
        run: helm lint infra/helm/umbrella -f infra/helm/umbrella/values.yaml -f infra/helm/umbrella/values-${{ inputs.environment }}.yaml
      - name: Helm deploy
        run: |
          helm upgrade --install transaction-engine ./infra/helm/umbrella \
            -f infra/helm/umbrella/values.yaml \
            -f infra/helm/umbrella/values-${{ inputs.environment }}.yaml \
            --namespace transaction-engine --create-namespace --wait --timeout 5m
      - name: Verify rollout
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/instance=transaction-engine -n transaction-engine --timeout=180s
          kubectl get pods -n transaction-engine
          kubectl get pdb -n transaction-engine
