name: SLSA Provenance

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        id: build
        run: |
          docker build -f services/transaction-service/Dockerfile -t ghcr.io/example/transaction-service:${{ github.sha }} .
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/example/transaction-service:${{ github.sha }} 2>/dev/null | cut -d@ -f2 || echo "sha256:$(sha256sum services/transaction-service/Dockerfile | cut -d' ' -f1)")
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "digest $DIGEST"

  provenance:
    needs: [build]
    permissions:
      actions: read
      id-token: write
      contents: write
      packages: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/example/transaction-service
      digest: ${{ needs.build.outputs.digest }}
      registry-username: ${{ github.actor }}

  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.1
        with:
          results_file: reports/scorecard.json
          results_format: json
          publish_results: true
      - name: Upload Scorecard
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: reports/scorecard.json
          retention-days: 30
