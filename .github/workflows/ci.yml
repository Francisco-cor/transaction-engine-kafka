name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, tests and quality checks
        run: mvn -B -ntp verify
      - name: Validate local infrastructure definition
        run: docker compose -f infra/docker-compose/docker-compose.yml config --quiet
