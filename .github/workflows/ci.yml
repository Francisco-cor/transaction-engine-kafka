name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, tests and quality checks
        run: mvn -B -ntp verify
      - name: Validate local infrastructure definition
        run: docker compose -f infra/docker-compose/docker-compose.yml config --quiet

  trivy-scan:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'
      - name: Fail on CRITICAL without triage
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Dependency Check (OWASP) via Maven profile
        run: mvn -B -ntp -Psecurity-scan verify -DskipTests
        continue-on-error: true

  sbom:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: reports/sbom/spdx.json
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: reports/sbom/cyclonedx.json
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: reports/sbom/
          retention-days: 30
      - name: Verify SBOM not empty
        run: |
          ls -lh reports/sbom/
          test -s reports/sbom/spdx.json
          test -s reports/sbom/cyclonedx.json

  docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/transaction-service/Dockerfile
          failure-threshold: warning
      - name: Validate compose with pinned digests
        run: docker compose -f infra/docker-compose/docker-compose.yml config --quiet
